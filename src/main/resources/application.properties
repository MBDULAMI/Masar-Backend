spring.application.name=masar
spring.profiles.active=dev

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-at-least-32-characters-for-hs256}
jwt.expiration-ms=86400000

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

booking.cutoff-minutes=30
booking.min-seats=1
booking.max-seats=4

refund.full-refund-hours=24
refund.partial-refund-hours=2
refund.full-refund-percentage=1.00
refund.partial-refund-percentage=0.50